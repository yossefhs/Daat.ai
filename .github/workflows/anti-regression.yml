# Garde-fou : détecte une publication sur `main` qui SUPPRIME des simanim déjà
# en ligne. Deux fois, une session travaillant sur une copie périmée a poussé un
# commit qui effaçait des dizaines de simanim sans que le message n'en dise rien.
# Ce workflow ne peut pas empêcher le push, mais il le signale en rouge tout de
# suite, au lieu de le laisser passer inaperçu pendant des jours.
name: Anti-régression du contenu

on:
  push:
    branches: [main]

jobs:
  simanim-perdus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comparer le nombre de simanim avant / après
        env:
          AVANT: ${{ github.event.before }}
        run: |
          set -u
          if [ -z "${AVANT}" ] || [ "${AVANT}" = "0000000000000000000000000000000000000000" ]; then
            echo "Pas d'état antérieur (branche neuve) — rien à comparer."; exit 0
          fi
          compte () { git ls-tree -d -r --name-only "$1" sources/ \
              | grep -cE '^sources/[a-z-]+/siman-[0-9]+$' || true; }
          a=$(compte "${AVANT}"); b=$(compte HEAD)
          echo "simanim avant : $a — après : $b"
          if [ "$b" -lt "$a" ]; then
            echo "::error::Ce push SUPPRIME $((a - b)) siman(im) déjà publiés."
            git ls-tree -d -r --name-only "${AVANT}" sources/ | sort > /tmp/a.txt
            git ls-tree -d -r --name-only HEAD sources/ | sort > /tmp/b.txt
            echo "Répertoires perdus :"; comm -23 /tmp/a.txt /tmp/b.txt | head -40
            echo ""
            echo "Cause probable : commit construit sur une copie périmée du dépôt."
            echo "Remède : git fetch origin main && git merge origin/main, restaurer"
            echo "les simanim manquants, puis republier."
            exit 1
          fi
          echo "Aucun siman perdu."
