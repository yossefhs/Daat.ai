# Configuration Alembic — système d'audit DaatTorah.
# L'URL réelle vient de AUDIT_DATABASE_URL (voir alembic/env.py) ;
# la valeur ci-dessous n'est qu'un repli de développement.

[alembic]
script_location = alembic
prepend_sys_path = .
sqlalchemy.url = sqlite:///./var/daat_audit.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
