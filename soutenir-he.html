<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>תמיכה בדעת — תרומה, הקדשה ונדבנות</title>
<!-- Page unifiée trilingue : /soutenir.html (ouvre en hébreu via ?lang=he).
     Cette ancienne page séparée est devenue une redirection pour ne pas casser
     les ~900 liens header/footer existants ni le référencement, et pour ne plus
     afficher les anciens plafonds « X questions/jour » (périmés). -->
<link rel="canonical" href="https://daattorah.com/soutenir.html?lang=he">
<meta name="robots" content="noindex,follow">
<meta http-equiv="refresh" content="0; url=/soutenir.html?lang=he">
<script>
  (function () {
    try {
      var p = new URLSearchParams(location.search);
      p.set('lang', 'he');
      location.replace('/soutenir.html?' + p.toString() + location.hash);
    } catch (e) {
      location.replace('/soutenir.html?lang=he');
    }
  })();
</script>
<!-- Vercel Web Analytics. Le script n'est servi qu'une fois Web Analytics activé
     sur le projet ; tant qu'il ne l'est pas, la requête est un 404 sans effet. -->
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<p>מפנה לעמוד <a href="/soutenir.html?lang=he">התמיכה</a>…</p>
</body>
</html>
